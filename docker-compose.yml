services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    depends_on:
      slither-worker:
        condition: service_healthy
    environment:
      CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
      AEGIS_SCAN_TOKEN: ${AEGIS_SCAN_TOKEN:?Set AEGIS_SCAN_TOKEN}
      AEGIS_WORKER_TOKEN: ${AEGIS_WORKER_TOKEN:?Set AEGIS_WORKER_TOKEN}
      AEGIS_WORKER_URL: http://slither-worker:8001
      AEGIS_DATABASE_PATH: /data/aegis.sqlite3
    volumes:
      - aegis-data:/data
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen(\'http://127.0.0.1:8000/health\', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks: [egress, internal]
  slither-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.worker
    environment:
      AEGIS_WORKER_TOKEN: ${AEGIS_WORKER_TOKEN:?Set AEGIS_WORKER_TOKEN}
    expose:
      - "8001"
    read_only: true
    tmpfs:
      - /tmp:size=128m,noexec,nosuid,nodev
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 2g
    cpus: 2
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks: [internal]
volumes:
  aegis-data:
networks:
  egress: {}
  internal:
    internal: true
