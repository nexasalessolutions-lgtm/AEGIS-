name: AEGIS CI
on:
  push:
    branches: [main, github-only-build]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r backend/requirements-dev.txt
      - run: cd backend && pytest -q
      - run: pip install pip-audit && pip-audit -r backend/requirements.txt
  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install
      - run: npm audit --json > npm-audit.json || true
      - run: node -e "const a=require('./npm-audit.json'); console.log(JSON.stringify(a.vulnerabilities || {}, null, 2))"
      - run: npm audit --audit-level=high
      - run: npm run build

  container-builds:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose configuration
        env:
          AEGIS_SCAN_TOKEN: ci-test-token
          AEGIS_WORKER_TOKEN: ci-worker-token
        run: docker compose config --quiet
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
      - uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile.worker
          push: false
